services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build: ./backend
    command: ["node", "dist/worker/worker.js"]
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  reaper:
    build: ./backend
    command: ["node", "dist/reaper/reaper.js"]
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  api:
    build: ./backend
    command: ["node", "dist/api/server.js"]
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - redis
    restart: unless-stopped
